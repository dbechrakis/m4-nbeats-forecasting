name: Tests and evidence
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt ruff==0.16.9
      - name: Lint
        run: ruff check src scripts tests --select E4,E7,E9,F
      - name: Validate committed results
        run: python ci/verify_evidence.py
      - name: Unit tests (metrics, benchmarks, windows, model, learning check)
        run: python -m unittest discover -s tests -v
      - name: Smoke-train on real M4 Weekly data
        run: |
          python scripts/download_data.py --frequency Weekly
          python scripts/train_nbeats.py --frequency Weekly --steps 60 --eval-every 30 --members 2 --subset 50 --output /tmp/smoke
